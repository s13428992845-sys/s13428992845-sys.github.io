<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏攻略大全 | Game Guide Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2007425330071723" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --card: #1c2128;
            --card-hover: #272e38;
            --border: #30363d;
            --text: #e6edf3;
            --text2: #b0b8c4;
            --text3: #6e7681;
            --accent: #58a6ff;
            --green: #3fb950;
            --orange: #d2991d;
            --red: #f85149;
            --purple: #a371f7;
            --cyan: #39d2c0;
            --pink: #db61a2;
            --sidebar-w: 260px;
            --header-h: 56px;
            --radius: 10px;
            --radius-sm: 6px;
            --transition: 0.2s ease;
        }

        *{margin:0;padding:0;box-sizing:border-box;}
        html{scroll-behavior:smooth;scroll-padding-top:var(--header-h);}
        body{
            font-family:'Noto Sans SC','Segoe UI',sans-serif;
            background:var(--bg);color:var(--text);
            line-height:1.65;display:flex;min-height:100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar{
            width:var(--sidebar-w);min-width:var(--sidebar-w);
            background:var(--bg2);border-right:1px solid var(--border);
            position:fixed;top:0;left:0;bottom:0;z-index:100;
            display:flex;flex-direction:column;overflow:hidden;
            transition:transform var(--transition);
        }
        .sidebar-logo{
            height:var(--header-h);display:flex;align-items:center;gap:10px;
            padding:0 18px;border-bottom:1px solid var(--border);
            font-family:'Orbitron',sans-serif;font-weight:700;font-size:1rem;
            color:var(--accent);flex-shrink:0;
        }
        .sidebar-logo .icon{font-size:1.4rem;}
        .sidebar-nav{flex:1;overflow-y:auto;padding:8px 0;}
        .sidebar-nav::-webkit-scrollbar{width:4px;}
        .sidebar-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

        .cat-title{
            display:flex;align-items:center;gap:8px;padding:10px 18px;
            font-size:0.82rem;font-weight:700;color:var(--text3);
            text-transform:uppercase;letter-spacing:1px;cursor:pointer;
            user-select:none;transition:var(--transition);
        }
        .cat-title:hover{color:var(--text2);}
        .cat-title .arrow{font-size:0.7rem;transition:transform var(--transition);margin-left:auto;}
        .cat-title.open .arrow{transform:rotate(90deg);}
        .cat-items{overflow:hidden;max-height:0;transition:max-height 0.35s ease;}
        .cat-items.open{max-height:600px;}

        .game-link{
            display:flex;align-items:center;gap:8px;padding:8px 18px 8px 36px;
            font-size:0.88rem;color:var(--text2);cursor:pointer;
            text-decoration:none;transition:var(--transition);
            border-left:3px solid transparent;
        }
        .game-link:hover{color:var(--text);background:rgba(88,166,255,0.06);}
        .game-link.active{color:var(--accent);background:rgba(88,166,255,0.1);border-left-color:var(--accent);}
        .game-link .emoji{font-size:1rem;width:22px;text-align:center;}

        /* ===== ADS ===== */
        .ad-container{
            display:flex;align-items:center;justify-content:center;
            overflow:hidden;margin:0 auto;
        }
        .ad-sidebar{
            padding:0 12px;flex-shrink:0;
        }
        .ad-sidebar .ad-label{
            font-size:0.65rem;color:var(--text3);text-align:center;
            letter-spacing:1px;text-transform:uppercase;margin:6px 0 4px;
        }
        .ad-top-banner{
            width:100%;max-width:728px;min-height:90px;
            margin-bottom:24px;background:var(--card);
            border:1px solid var(--border);border-radius:var(--radius-sm);
        }
        .ad-top-banner .ad-label{
            font-size:0.65rem;color:var(--text3);text-align:center;
            letter-spacing:1px;text-transform:uppercase;padding-top:6px;
        }
        .ad-bottom{
            width:100%;max-width:728px;min-height:90px;
            margin-top:32px;padding-top:20px;
            border-top:1px solid var(--border);
        }
        .ad-bottom .ad-label{
            font-size:0.65rem;color:var(--text3);text-align:center;
            letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;
        }
        .ad-in-article{
            width:100%;max-width:336px;min-height:280px;
            margin:20px auto;background:var(--card);
            border:1px solid var(--border);border-radius:var(--radius-sm);
        }
        .ad-in-article .ad-label{
            font-size:0.65rem;color:var(--text3);text-align:center;
            letter-spacing:1px;text-transform:uppercase;padding-top:6px;
        }
        @media(max-width:500px){
            .ad-top-banner,.ad-bottom{min-height:50px;}
            .ad-in-article{min-height:250px;}
        }

        .sidebar-bottom{
            padding:12px 18px;border-top:1px solid var(--border);
            flex-shrink:0;display:flex;align-items:center;gap:10px;
        }
        .lang-btn{
            flex:1;padding:8px 12px;border-radius:var(--radius-sm);
            border:1px solid var(--border);background:var(--bg3);
            color:var(--text2);cursor:pointer;font-size:0.82rem;
            font-weight:600;transition:var(--transition);text-align:center;
            font-family:inherit;
        }
        .lang-btn:hover{border-color:var(--accent);color:var(--accent);}

        /* ===== MAIN ===== */
        .main{
            margin-left:var(--sidebar-w);flex:1;min-width:0;
            padding-top:var(--header-h);
        }
        .topbar{
            position:fixed;top:0;left:var(--sidebar-w);right:0;z-index:99;
            height:var(--header-h);background:rgba(13,17,23,0.88);
            backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            border-bottom:1px solid var(--border);
            display:flex;align-items:center;padding:0 24px;gap:12px;
        }
        .topbar .breadcrumb{font-size:0.85rem;color:var(--text3);}
        .topbar .breadcrumb span{color:var(--accent);}
        .topbar .search-wrap{
            margin-left:auto;position:relative;
        }
        .topbar .search-wrap input{
            width:200px;padding:7px 14px 7px 36px;border-radius:20px;
            border:1px solid var(--border);background:var(--bg3);
            color:var(--text);font-size:0.85rem;outline:none;
            transition:var(--transition);font-family:inherit;
        }
        .topbar .search-wrap input:focus{width:260px;border-color:var(--accent);}
        .topbar .search-wrap .search-icon{
            position:absolute;left:12px;top:50%;transform:translateY(-50%);
            color:var(--text3);font-size:0.85rem;pointer-events:none;
        }
        .menu-toggle{
            display:none;background:none;border:none;
            color:var(--text);font-size:1.4rem;cursor:pointer;padding:4px;
        }

        /* ===== CONTENT ===== */
        .content{padding:32px 40px;max-width:1100px;}
        .game-section{display:none;}
        .game-section.active{display:block;}
        .page-hero{
            margin-bottom:36px;padding-bottom:28px;
            border-bottom:1px solid var(--border);
        }
        .page-hero .game-icon{font-size:4rem;display:block;margin-bottom:16px;}
        .page-hero h1{
            font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:900;
            margin-bottom:6px;
        }
        .page-hero .en-name{font-size:1rem;color:var(--text3);margin-bottom:12px;}
        .page-hero .desc{color:var(--text2);font-size:0.95rem;max-width:700px;}

        /* Tabs */
        .tab-bar{display:flex;gap:4px;margin-bottom:28px;flex-wrap:wrap;}
        .tab-btn{
            padding:10px 22px;border-radius:var(--radius-sm);border:none;
            background:var(--card);color:var(--text2);cursor:pointer;
            font-size:0.9rem;font-weight:600;transition:var(--transition);
            font-family:inherit;
        }
        .tab-btn:hover{color:var(--text);background:var(--card-hover);}
        .tab-btn.active{background:var(--accent);color:#fff;}
        .tab-panel{display:none;}
        .tab-panel.active{display:block;}

        /* Cards */
        .article-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}
        .article-card{
            background:var(--card);border:1px solid var(--border);
            border-radius:var(--radius);padding:20px 22px;
            transition:var(--transition);cursor:pointer;display:block;
            text-decoration:none;color:inherit;
        }
        .article-card:hover{
            background:var(--card-hover);border-color:var(--accent);
            transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,0.3);
        }
        .article-card .tag{
            display:inline-block;padding:2px 10px;border-radius:12px;
            font-size:0.7rem;font-weight:700;margin-bottom:10px;
            letter-spacing:0.5px;
        }
        .tag.beginner{background:rgba(63,185,80,0.15);color:var(--green);}
        .tag.core{background:rgba(88,166,255,0.15);color:var(--accent);}
        .tag.longtail{background:rgba(163,113,247,0.15);color:var(--purple);}
        .article-card h4{font-size:0.95rem;font-weight:600;margin-bottom:6px;line-height:1.5;}
        .article-card .excerpt{font-size:0.82rem;color:var(--text3);}

        /* Game meta */
        .game-meta{
            display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;
        }
        .meta-chip{
            padding:4px 14px;border-radius:16px;font-size:0.78rem;
            background:var(--bg3);color:var(--text2);border:1px solid var(--border);
        }

        /* Expandable detail */
        .detail-modal{
            display:none;position:fixed;inset:0;z-index:200;
            background:rgba(0,0,0,0.7);align-items:center;justify-content:center;
        }
        .detail-modal.open{display:flex;}
        .detail-content{
            background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
            width:90%;max-width:700px;max-height:80vh;overflow-y:auto;
            padding:32px;position:relative;
        }
        .detail-close{
            position:absolute;top:12px;right:16px;
            background:none;border:none;color:var(--text3);
            font-size:1.4rem;cursor:pointer;transition:var(--transition);
        }
        .detail-close:hover{color:var(--red);}
        .detail-content h3{font-size:1.3rem;margin-bottom:8px;}
        .detail-content .detail-tag{margin-bottom:16px;}
        .detail-content .detail-body{color:var(--text2);line-height:1.8;}
        .detail-content .detail-body ul{padding-left:20px;margin:12px 0;}
        .detail-content .detail-body li{margin:6px 0;}

        /* Responsive */
        @media(max-width:900px){
            .sidebar{transform:translateX(-100%);}
            .sidebar.open{transform:translateX(0);}
            .main{margin-left:0;}
            .topbar{left:0;}
            .menu-toggle{display:block;}
            .content{padding:24px 20px;}
            .article-grid{grid-template-columns:1fr;}
        }
        @media(max-width:500px){
            .tab-btn{padding:8px 14px;font-size:0.82rem;}
            .page-hero h1{font-size:1.5rem;}
            .topbar .search-wrap input{width:120px;}
            .topbar .search-wrap input:focus{width:160px;}
        }
    </style>
</head>

</div>

<script>
// ==================== DATA ====================
const gameData = [
    // ========= 模拟经营 =========
    {
        id:'stardew', emoji:'🌾',
        zh:'星露谷物语', en:'Stardew Valley',
        cat:'sim', catZh:'模拟经营', catEn:'Simulation',
        descZh:'从城市到乡村，打造你的梦想农场。耕种、采矿、钓鱼、交友，体验最治愈的田园生活。',
        descEn:'Escape the city and build your dream farm. Farm, mine, fish, befriend villagers — the ultimate cozy life sim.',
        metaZh:['ConcernedApe','单机/联机','农耕模拟','全平台'], metaEn:['ConcernedApe','Single/Multi','Farming Sim','All Platforms'],
        tabs:[
            {id:'beginner',zh:'入门必更',en:'Starter Guides',articles:[
                {tag:'beginner',zh:'星露谷物语新手开局第一天详细攻略',en:'Day 1 Beginner Guide — Complete Walkthrough',exZh:'第一天最优化流程：清理农场、种植防风草、认识村民、收集材料，最大化第一天收益。',exEn:'Optimize Day 1: clear farm, plant parsnips, meet villagers, gather resources for maximum efficiency.',detailZh:'<p>第一天的行动至关重要，合理安排可以让你领先至少3-5天的进度。</p><ul><li><b>清理农场：</b>用镰刀清除杂草（不耗体力），用斧头砍树枝，保留所有木材和石头。</li><li><b>种植防风草：</b>皮埃尔商店购买15个防风草种子，全部种下并浇水。</li><li><b>认识村民：</b>在镇中心广场与28位村民对话，完成"Introductions"任务获得100g。</li><li><b>采集：</b>沿途收集野葱、蒲公英、韭葱等春季采集物，卖掉换金币。</li><li><b>钓鱼初体验：</b>收到威利的钓鱼竿后，去山湖练习钓鱼，鱼可以卖钱或补充体力。</li><li><b>睡前准备：</b>把背包里所有东西整理好，多余体力砍树或钓鱼，不要浪费任何体力。</li></ul>',detailEn:'<p>Your first day sets the pace for the entire game. A good Day 1 can put you 3-5 days ahead.</p><ul><li><b>Clear farm:</b> Use scythe on weeds (no energy cost), chop branches with axe. Save all wood and stone.</li><li><b>Plant Parsnips:</b> Buy 15 seeds from Pierre\'s, plant and water all of them.</li><li><b>Meet villagers:</b> Talk to 28 NPCs in town square to complete "Introductions" quest for 100g.</li><li><b>Forage:</b> Collect Spring Onions, Dandelions, Leeks along the way. Sell for gold.</li><li><b>Try fishing:</b> After getting Willy\'s rod, practice at Mountain Lake. Fish = money + energy food.</li><li><b>Before bed:</b> Organize inventory. Use remaining energy to chop trees or fish. Never waste energy.</li></ul>'},
                {tag:'beginner',zh:'星露谷物语中文设置及存档位置说明',en:'Language Settings & Save File Location',exZh:'Steam/WeGame/GOG各平台中文设置方法，以及不同系统的存档路径说明。',exEn:'How to set Chinese language on Steam/WeGame/GOG, plus save file locations for all OS.',detailZh:'<p><b>中文设置：</b></p><ul><li>Steam：库→右键星露谷→属性→语言→简体中文</li><li>WeGame：游戏设置→语言选择</li><li>GOG：设置→语言选项</li><li>游戏内：主菜单→设置（齿轮图标）→语言</li></ul><p><b>存档位置：</b></p><ul><li>Windows: %APPDATA%/StardewValley/Saves/</li><li>Mac: ~/.config/StardewValley/Saves/</li><li>Linux: ~/.config/StardewValley/Saves/</li><li>每个存档是一个以角色名+随机数命名的文件夹</li></ul>',detailEn:'<p><b>Language Settings:</b></p><ul><li>Steam: Library → Right-click SV → Properties → Language → Simplified Chinese</li><li>WeGame: Game Settings → Language</li><li>GOG: Settings → Language Options</li><li>In-game: Main Menu → Settings (gear icon) → Language</li></ul><p><b>Save Locations:</b></p><ul><li>Windows: %APPDATA%/StardewValley/Saves/</li><li>Mac: ~/.config/StardewValley/Saves/</li><li>Linux: ~/.config/StardewValley/Saves/</li><li>Each save is a folder named with character name + random digits</li></ul>'},
                {tag:'beginner',zh:'星露谷物语最低配置要求及闪退常见问题解决',en:'System Requirements & Crash Fixes',exZh:'最低/推荐配置一览，闪退、黑屏、存档损坏等常见问题的解决方法汇总。',exEn:'Min/recommended specs, crash/black screen/corrupt save fixes.',detailZh:'<p><b>最低配置：</b>CPU 2Ghz / RAM 2GB / GPU 256MB显存 / 硬盘 500MB</p><p><b>推荐配置：</b>CPU 2Ghz+ / RAM 4GB / GPU 512MB+</p><p><b>常见问题：</b></p><ul><li><b>闪退：</b>更新显卡驱动，关闭杀毒软件，以管理员身份运行</li><li><b>黑屏：</b>删除启动选项中的兼容性设置，验证游戏完整性</li><li><b>存档损坏：</b>Saves文件夹内有_old备份，重命名即可恢复</li><li><b>MOD冲突：</b>更新SMAPI，逐个禁用MOD排查</li></ul>',detailEn:'<p><b>Minimum:</b> CPU 2Ghz / RAM 2GB / GPU 256MB VRAM / 500MB storage</p><p><b>Recommended:</b> CPU 2Ghz+ / RAM 4GB / GPU 512MB+</p><p><b>Common fixes:</b></p><ul><li><b>Crash:</b> Update GPU drivers, disable antivirus, run as admin</li><li><b>Black screen:</b> Remove compatibility settings, verify game files</li><li><b>Corrupt save:</b> Rename _old backup folder in Saves directory</li><li><b>MOD issues:</b> Update SMAPI, disable MODs one by one to find culprit</li></ul>'},
            ]},
            {id:'core',zh:'核心攻略',en:'Core Guides',articles:[
                {tag:'core',zh:'星露谷物语春季作物推荐 最赚钱作物排行',en:'Spring Crop Guide — Most Profitable Ranking',exZh:'土豆、草莓、甘蓝、蓝爵收益对比，春季种什么最赚钱？附蛋蛋节草莓购买策略。',exEn:'Potato vs Strawberry vs Kale profit comparison. What to plant in Spring + Egg Festival strategy.',detailZh:'<p><b>春季最强作物：草莓</b>（蛋蛋节购买，100g/种子，售价120g+，持续收获）</p><p><b>常规推荐：</b></p><ul><li>🥇 草莓 — 日收益约20g/天，只限蛋蛋节购买</li><li>🥈 土豆 — 日收益约8.3g/天，有概率多收</li><li>🥉 甘蓝 — 日收益约6.7g/天，经验值高</li><li>4. 绿豆 — 日收益约5.6g/天，持续收获</li></ul><p><b>策略：</b>蛋蛋节前种土豆积累资金，蛋蛋节把所有钱买草莓种子。留几个草莓做种子制造机，第二年大量种植。</p>',detailEn:'<p><b>Spring MVP: Strawberry</b> (Egg Festival purchase, 100g/seed, 120g+ sell, regrows)</p><p><b>Ranking:</b></p><ul><li>🥇 Strawberry — ~20g/day, Egg Festival exclusive</li><li>🥈 Potato — ~8.3g/day, chance for extra yield</li><li>🥉 Kale — ~6.7g/day, high XP</li><li>4. Green Bean — ~5.6g/day, regrows</li></ul><p><b>Strategy:</b> Plant potatoes before Egg Festival, spend all gold on strawberries at festival. Save a few for Seed Maker for Year 2 mass planting.</p>'},
                {tag:'core',zh:'星露谷物语全村民喜好表 好感度提升攻略',en:'Complete Villager Gift Guide — Friendship Tips',exZh:'30+位村民最爱/喜欢/讨厌的礼物清单，好感度快速提升方法，生日送礼×8倍效果！',exEn:'30+ villagers loved/liked/hated gifts. Fast friendship methods. Birthday gifts = ×8 effect!',detailZh:'<p><b>快速提升好感度的方法：</b></p><ul><li>🎂 <b>生日送礼：</b>效果×8倍！务必记住所有村民生日</li><li>⭐ <b>高品质礼物：</b>铱星品质的礼物效果×1.5</li><li>🎄 <b>冬日星盛宴：</b>给秘密朋友送礼效果×5</li><li>📋 <b>公告栏任务：</b>完成可获得150好感度</li></ul><p><b>通用最爱礼物：</b>七彩碎片（除海莉）、兔子脚（所有人）、珍珠（除潘妮）</p>',detailEn:'<p><b>Fast friendship methods:</b></p><ul><li>🎂 <b>Birthday gifts:</b> ×8 effect! Track all birthdays</li><li>⭐ <b>Quality gifts:</b> Iridium quality = ×1.5 effect</li><li>🎄 <b>Feast of Winter Star:</b> Secret friend gift = ×5</li><li>📋 <b>Help Wanted quests:</b> Complete for 150 friendship</li></ul><p><b>Universal loves:</b> Prismatic Shard (except Haley), Rabbit\'s Foot (everyone), Pearl (except Penny)</p>'},
                {tag:'core',zh:'星露谷物语社区中心全献祭任务完成指南',en:'Community Center Bundle Completion Guide',exZh:'6大房间全部收集包一览，所需物品清单及获取方式，按季节推荐完成顺序。',exEn:'All 6 room bundles, required items & how to get them. Recommended completion order by season.',detailZh:'<p><b>推荐完成顺序：</b></p><ul><li>1. 🔨 工艺室（采集）→ 修复采石场旁桥梁</li><li>2. 🔥 锅炉室（采矿）→ 修复矿车，快速旅行</li><li>3. 🥕 食品储藏室（农耕）→ 修复温室！全年种植</li><li>4. 💰 金库 → 巴士站修复，解锁沙漠</li><li>5. 🐟 鱼缸 → 移除矿洞旁巨石</li><li>6. 📋 公告栏 → 全体村民+2❤️</li></ul><p>温室是第一年最重要的目标，尽量秋季前完成食品储藏室！</p>',detailEn:'<p><b>Recommended order:</b></p><ul><li>1. 🔨 Crafts Room → Repair bridge near quarry</li><li>2. 🔥 Boiler Room → Repair minecarts, fast travel</li><li>3. 🥕 Pantry → Repair greenhouse! Year-round crops</li><li>4. 💰 Vault → Bus repair, unlock desert</li><li>5. 🐟 Fish Tank → Remove boulder near mines</li><li>6. 📋 Bulletin Board → +2❤️ all villagers</li></ul><p>Greenhouse is the #1 Year 1 priority — finish Pantry before Fall if possible!</p>'},
                {tag:'core',zh:'星露谷物语钓鱼技巧大全 各季节鱼王位置',en:'Fishing Guide — Legendary Fish & Tips',exZh:'5大传奇鱼位置+条件，钓鱼技巧详解，各季节全鱼种出现时间与地点。',exEn:'5 legendary fish locations & conditions. Fishing techniques. All seasonal fish time/location.',detailZh:'<p><b>五大传奇鱼（每存档只能钓一次）：</b></p><ul><li>🐟 传说之鱼 — 春季·山湖·雨天·钓鱼10级以上</li><li>🐠 变异鲤鱼 — 全年·下水道·无特殊条件</li><li>🦑 绯红鱼 — 夏季·海滩东侧码头</li><li>🐡 安康鱼 — 秋季·小镇河·钓鱼3级以上</li><li>🐋 冰河鱼 — 冬季·煤森林河流南端</li></ul><p><b>高级技巧：</b>陷阱浮标减慢鱼逃跑速度；食用海之菜肴(+3钓鱼)；高幸运日更容易钓到稀有鱼。</p>',detailEn:'<p><b>5 Legendary Fish (once per save):</b></p><ul><li>🐟 Legend — Spring·Mountain Lake·Rain·Fishing 10+</li><li>🐠 Mutant Carp — Any season·Sewer</li><li>🦑 Crimsonfish — Summer·East Pier on Beach</li><li>🐡 Angler — Fall·Town River·Fishing 3+</li><li>🐋 Glacierfish — Winter·South Cindersap Forest River</li></ul><p><b>Pro tips:</b> Trap Bobber slows escape; Dish o\' the Sea (+3 Fishing); high luck days increase rare fish chance.</p>'},
                {tag:'core',zh:'星露谷物语农场布局方案 新手最优布局推荐',en:'Farm Layout Guide — Best Beginner Designs',exZh:'标准农场/河边农场/森林农场布局设计，洒水器高效排列方案，建筑位置推荐。',exEn:'Standard/River/Forest farm designs. Efficient sprinkler layouts. Building placement tips.',detailZh:'<p><b>推荐新手农场类型：标准农场</b>（面积最大，布局灵活）</p><p><b>洒水器布局：</b></p><ul><li>🎯 中级洒水器覆盖8格（3×3去掉四角）</li><li>🎯 铱洒水器覆盖24格（5×5），终极目标</li><li>🎯 稻草人覆盖半径8格，每16×16区域放一个</li></ul><p><b>建筑区：</b>畜棚和鸡舍放在农场下方靠近草地，筒仓建在畜棚旁边。果树种在温室周围。</p>',detailEn:'<p><b>Best beginner farm: Standard Farm</b> (largest area, flexible layout)</p><p><b>Sprinkler layouts:</b></p><ul><li>🎯 Quality Sprinkler covers 8 tiles (3×3 minus corners)</li><li>🎯 Iridium Sprinkler covers 24 tiles (5×5), endgame goal</li><li>🎯 Scarecrow covers 8-tile radius, one per 16×16 area</li></ul><p><b>Buildings:</b> Barns/Coops near bottom close to grass. Silos next to animal buildings. Fruit trees around greenhouse.</p>'},
            ]},
            {id:'longtail',zh:'长尾问题',en:'Advanced Topics',articles:[
                {tag:'longtail',zh:'星露谷物语 MOD 安装及排序详细教程',en:'MOD Installation & Load Order Guide',exZh:'SMAPI安装、Nexus MOD下载、Content Patcher使用、MOD排序工具及冲突排查。',exEn:'SMAPI setup, Nexus MODs download, Content Patcher usage, load order & conflict resolution.',detailZh:'<p><b>安装步骤：</b></p><ul><li>1. 下载并安装SMAPI（Stardew Modding API）</li><li>2. 运行一次游戏确保SMAPI正常工作</li><li>3. 下载MOD放入Mods文件夹</li><li>4. 使用Generic Mod Config Menu调整设置</li></ul><p><b>必备MOD推荐：</b>UI Info Suite、Chests Anywhere、Automate、Lookup Anything、NPC Map Locations</p>',detailEn:'<p><b>Installation:</b></p><ul><li>1. Download and install SMAPI (Stardew Modding API)</li><li>2. Run game once to verify SMAPI works</li><li>3. Download MODs into Mods folder</li><li>4. Use Generic Mod Config Menu to adjust settings</li></ul><p><b>Essential MODs:</b> UI Info Suite, Chests Anywhere, Automate, Lookup Anything, NPC Map Locations</p>'},
                {tag:'longtail',zh:'星露谷物语全成就解锁条件汇总',en:'All Achievements Unlock Guide',exZh:'40个Steam成就完整列表及解锁条件，最难成就完成技巧。',exEn:'Complete list of 40 Steam achievements with unlock conditions. Hardest achievement strategies.',detailZh:'<p>共40个成就，分为采集、农耕、钓鱼、采矿、战斗、社交等类别。最难的几个：</p><ul><li>🏆 <b>草原之王：</b>通关草原之王之旅小游戏且不死亡</li><li>🏆 <b>全额出货：</b>每种作物和采集物卖出15个</li><li>🏆 <b>烹饪大师：</b>制作所有料理（共80+种）</li><li>🏆 <b>工艺大师：</b>制作所有物品</li></ul><p>建议对照Wiki逐项完成，使用"Stardew Checkup"网站追踪进度。</p>',detailEn:'<p>40 achievements total. Hardest ones:</p><ul><li>🏆 <b>Fector\'s Challenge:</b> Beat Journey of the Prairie King without dying</li><li>🏆 <b>Polyculture:</b> Ship 15 of each crop</li><li>🏆 <b>Gourmet Chef:</b> Cook every recipe (80+)</li><li>🏆 <b>Craft Master:</b> Craft every item</li></ul><p>Use the wiki checklist and "Stardew Checkup" website to track progress.</p>'},
            ]}
        ]
    },

    {
        id:'dyson', emoji:'🌌',
        zh:'戴森球计划', en:'Dyson Sphere Program',
        cat:'sim', catZh:'模拟经营', catEn:'Simulation',
        descZh:'从一颗星球开始，建立跨星系的自动化工厂，最终建造包裹恒星的戴森球。国产科幻模拟经营神作。',
        descEn:'Start from one planet, build an interstellar automated factory, and ultimately construct a Dyson Sphere around a star. A Chinese sci-fi simulation masterpiece.',
        metaZh:['Youthcat Studio','单机','自动化工厂','PC'], metaEn:['Youthcat Studio','Single Player','Automation','PC'],
        tabs:[
            {id:'beginner',zh:'入门必更',en:'Starter Guides',articles:[
                {tag:'beginner',zh:'戴森球计划新手开局流程攻略 前10小时发展思路',en:'First 10 Hours Beginner Guide',exZh:'从降落母星到建立蓝糖产线，前10小时关键节点与资源管理策略。',exEn:'From landing to Blue Science production — key milestones and resource management for first 10 hours.',detailZh:'<p><b>前10小时关键节点：</b></p><ul><li><b>第0-2小时：</b>采集基础资源（铁、铜、石、煤），建造采矿机覆盖矿脉</li><li><b>第2-4小时：</b>建立基础冶炼线，解锁蓝糖科技，开始研究</li><li><b>第4-7小时：</b>铺设传送带网络，建立蓝糖自动化产线</li><li><b>第7-10小时：</b>解锁红糖科技，开始星际航行准备</li></ul><p><b>核心原则：</b>不要手搓！任何需要超过50个的物品都应该自动化生产。</p>',detailEn:'<p><b>First 10 hours milestones:</b></p><ul><li><b>0-2h:</b> Gather basic resources (iron, copper, stone, coal), place miners on veins</li><li><b>2-4h:</b> Build smelting lines, unlock Blue Science, start research</li><li><b>4-7h:</b> Lay conveyor networks, automate Blue Science production</li><li><b>7-10h:</b> Unlock Red Science, prepare for interstellar travel</li></ul><p><b>Core rule:</b> Don\'t hand-craft! Automate anything you need more than 50 of.</p>'},
                {tag:'beginner',zh:'戴森球计划存档位置及配置要求说明',en:'Save Location & System Requirements',exZh:'各平台存档路径说明，最低/推荐配置要求一览。',exEn:'Save file locations for all platforms, min/recommended specs.',detailZh:'<p><b>存档位置：</b>Documents/Dyson Sphere Program/Save/</p><p><b>最低配置：</b>i3-530 / 4GB RAM / GTX 750 / 3GB硬盘</p><p><b>推荐配置：</b>i7-7700 / 16GB RAM / GTX 1060 6GB / SSD 10GB</p><p>后期产线庞大时对CPU要求很高，建议使用高性能处理器。</p>',detailEn:'<p><b>Save location:</b> Documents/Dyson Sphere Program/Save/</p><p><b>Minimum:</b> i3-530 / 4GB RAM / GTX 750 / 3GB storage</p><p><b>Recommended:</b> i7-7700 / 16GB RAM / GTX 1060 6GB / SSD 10GB</p><p>Late game requires strong CPU due to massive production lines.</p>'},
                {tag:'beginner',zh:'戴森球计划常见闪退、卡顿问题解决方法',en:'Crash & Lag Fix Guide',exZh:'游戏闪退、帧率过低、存档加载失败等常见问题排查方案。',exEn:'Crash, low FPS, save loading failure — troubleshooting guide.',detailZh:'<p><b>常见问题解决：</b></p><ul><li><b>后期卡顿：</b>降低画质设置，分散产线到不同星球，使用物流塔替代长传送带</li><li><b>闪退：</b>更新显卡驱动，关闭后台程序，增加虚拟内存至16GB+</li><li><b>存档损坏：</b>Save文件夹内有自动备份，重命名.restore文件即可</li></ul>',detailEn:'<p><b>Fixes:</b></p><ul><li><b>Late game lag:</b> Lower graphics, spread production across planets, use logistics stations instead of long belts</li><li><b>Crashes:</b> Update GPU drivers, close background apps, increase virtual memory to 16GB+</li><li><b>Corrupt save:</b> Auto-backups in Save folder, rename .restore files</li></ul>'},
            ]},
            {id:'core',zh:'核心攻略',en:'Core Guides',articles:[
                {tag:'core',zh:'戴森球计划科技树解锁顺序 新手优先研究推荐',en:'Tech Tree Priority Guide',exZh:'蓝糖→红糖→黄糖→紫糖→绿糖→白糖，各阶段优先解锁的关键科技。',exEn:'Blue→Red→Yellow→Purple→Green→White science. Key techs to unlock at each stage.',detailZh:'<p><b>科技解锁优先级：</b></p><ul><li>🔵 <b>蓝糖阶段：</b>基础物流→电磁学→基础制造→冶炼升级</li><li>🔴 <b>红糖阶段：</b>星际航行→物流塔→传送带升级</li><li>🟡 <b>黄糖阶段：</b>星际物流塔→钛晶石→推进器</li><li>🟣 <b>紫糖阶段：</b>粒子宽带→戴森球节点→射线接收站</li><li>🟢 <b>绿糖阶段：</b>翘曲器→引力透镜→空间翘曲</li></ul>',detailEn:'<p><b>Tech priorities:</b></p><ul><li>🔵 <b>Blue:</b> Basic Logistics→Electromagnetism→Basic Manufacturing→Smelting Upgrade</li><li>🔴 <b>Red:</b> Interstellar Travel→Logistics Station→Belt Upgrades</li><li>🟡 <b>Yellow:</b> Interstellar Logistics Station→Titanium Crystal→Thruster</li><li>🟣 <b>Purple:</b> Particle Broadband→Dyson Sphere Node→Ray Receiver</li><li>🟢 <b>Green:</b> Warper→Graviton Lens→Space Warper</li></ul>'},
                {tag:'core',zh:'戴森球计划新手生产线布局 自动化基础方案',en:'Production Line Layout — Automation Basics',exZh:'从手搓到全自动，基础冶炼线→电路板产线→处理器产线，逐步升级布局方案。',exEn:'From handcrafting to full automation. Smelting→Circuit Board→Processor production layouts.',detailZh:'<p><b>基础布局原则：</b></p><ul><li>📐 总线式布局：主传送带+分支产线</li><li>📐 模块化设计：每种产品独立模块，便于扩展</li><li>📐 预留空间：每条产线之间留3-5格通道</li></ul><p><b>经典布局示例：</b>铁矿→铁板→齿轮+电路板→蓝糖；铜矿→铜板→线圈→电路板</p>',detailEn:'<p><b>Layout principles:</b></p><ul><li>📐 Bus system: main belt + branch production</li><li>📐 Modular design: each product as independent module, easy to expand</li><li>📐 Leave space: 3-5 tile corridors between production lines</li></ul><p><b>Classic layout:</b> Iron ore→Iron plates→Gears+Circuit Boards→Blue Science; Copper ore→Copper plates→Coils→Circuit Boards</p>'},
            ]},
            {id:'longtail',zh:'长尾问题',en:'Advanced Topics',articles:[
                {tag:'longtail',zh:'戴森球计划蓝图使用及导入导出教程',en:'Blueprint System Tutorial',exZh:'蓝图创建保存、粘贴使用、跨存档导入导出，社区优秀蓝图推荐。',exEn:'Blueprint creation, paste usage, cross-save import/export. Community blueprint recommendations.',detailZh:'<p>蓝图系统允许复制粘贴建筑布局，大幅提高建造效率。可以保存自己的设计或从社区下载优秀蓝图。</p>',detailEn:'<p>The blueprint system lets you copy-paste building layouts, dramatically improving construction speed. Save your own designs or download from the community.</p>'},
                {tag:'longtail',zh:'戴森球计划全成就解锁条件一览',en:'All Achievements Guide',exZh:'完整成就列表及达成条件，最稀有的几个成就获取策略。',exEn:'Complete achievement list with conditions. Strategies for rarest achievements.',detailZh:'<p>涵盖生产、探索、建造等各类成就。其中最难的包括"戴森球完成"和"每分钟产出目标"类成就。</p>',detailEn:'<p>Covers production, exploration, construction achievements. Hardest include "Dyson Sphere Complete" and "per-minute production targets".</p>'},
            ]}

// ==================== RENDER ====================
let currentLang = 'zh';
let currentGame = null;

const $sidebarNav = document.getElementById('sidebarNav');
const $contentArea = document.getElementById('contentArea');
const $breadcrumb = document.getElementById('breadcrumb');
const $detailModal = document.getElementById('detailModal');
const $detailContent = document.getElementById('detailContent');
const $searchInput = document.getElementById('searchInput');

// Build sidebar nav
function buildSidebar() {
    const cats = [
        {id:'sim', zh:'模拟经营', en:'Simulation', icon:'🏭'},
        {id:'survival', zh:'生存建造', en:'Survival & Build', icon:'🏕️'},
        {id:'sandbox', zh:'沙盒冒险', en:'Sandbox Adventure', icon:'🌍'},
        {id:'chinese', zh:'国风单机', en:'Chinese RPG', icon:'🏮'}
    ];

    let html = '';
    cats.forEach(cat => {
        const catGames = gameData.filter(g => g.cat === cat.id);
        html += `<div class="cat-title" data-cat="${cat.id}" onclick="toggleCat(this)">
            <span>${cat.icon}</span> <span data-zh="${cat.zh}" data-en="${cat.en}">${cat.zh}</span>
            <span class="arrow">▶</span>
        </div>`;
        html += `<div class="cat-items" id="cat-${cat.id}">`;
        catGames.forEach(g => {
            html += `<a class="game-link" href="#${g.id}" data-game="${g.id}" onclick="selectGame('${g.id}')">
                <span class="emoji">${g.emoji}</span>
                <span data-zh="${g.zh}" data-en="${g.en}">${g.zh}</span>
            </a>`;
        });
        html += `</div>`;
    });
    $sidebarNav.innerHTML = html;

    // Open first category by default
    const firstCat = document.querySelector('.cat-title');
    if(firstCat) firstCat.click();
}

function toggleCat(el) {
    const catId = el.dataset.cat;
    const items = document.getElementById('cat-' + catId);
    el.classList.toggle('open');
    items.classList.toggle('open');
}

function selectGame(id) {
    currentGame = gameData.find(g => g.id === id);
    if(!currentGame) return;

    // Update sidebar active
    document.querySelectorAll('.game-link').forEach(l => l.classList.remove('active'));
    const link = document.querySelector(`.game-link[data-game="${id}"]`);
    if(link) link.classList.add('active');

    renderGame(currentGame);

    // On mobile, close sidebar
    document.getElementById('sidebar').classList.remove('open');
}

function renderGame(game) {
    const L = currentLang;
    const gameSection = document.createElement('div');
    gameSection.className = 'game-section active';

    // Breadcrumb
    const catName = L==='zh' ? game.catZh : game.catEn;
    const gameName = L==='zh' ? game.zh : game.en;
    $breadcrumb.innerHTML = `<span data-zh="首页" data-en="Home">首页</span> › ${catName} › <span style="color:var(--accent)">${gameName}</span>`;

    // Top banner ad
    let html = `<div class="ad-container ad-top-banner">
        <div class="ad-label">${L==='zh' ? '广告' : 'Advertisement'}</div>
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-2007425330071723"
             data-ad-slot="3002501617"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
    </div>`;

    // Hero
    html += `<div class="page-hero">
        <span class="game-icon">${game.emoji}</span>
        <h1>${L==='zh' ? game.zh : game.en}</h1>
        <div class="en-name">${L==='en' ? game.zh : game.en}</div>
        <p class="desc">${L==='zh' ? game.descZh : game.descEn}</p>
        <div class="game-meta">${(L==='zh' ? game.metaZh : game.metaEn).map(m=>`<span class="meta-chip">${m}</span>`).join('')}</div>
    </div>`;

    // Tabs
    const tabIds = game.tabs.map(t => t.id);
    const tabLabels = {beginner:L==='zh'?'入门必更':'Starter', core:L==='zh'?'核心攻略':'Core', longtail:L==='zh'?'长尾问题':'Advanced'};
    const tabColors = {beginner:'green', core:'accent', longtail:'purple'};

    html += `<div class="tab-bar">`;
    game.tabs.forEach(t => {
        html += `<button class="tab-btn ${t.id==='beginner'?'active':''}" data-tab="${t.id}" onclick="switchTab(this,'${game.id}')">
            ${tabLabels[t.id]}
        </button>`;
    });
    html += `</div>`;

    // Tab panels
    game.tabs.forEach(t => {
        html += `<div class="tab-panel ${t.id==='beginner'?'active':''}" id="tab-${game.id}-${t.id}">
            <div class="article-grid">`;
        t.articles.forEach((a,i) => {
            const tagClass = a.tag;
            const tagLabel = {beginner:L==='zh'?'入门':'Starter', core:L==='zh'?'核心':'Core', longtail:L==='zh'?'长尾':'Advanced'};
            const title = L==='zh' ? a.zh : a.en;
            const excerpt = L==='zh' ? a.exZh : a.exEn;
            html += `<div class="article-card" onclick="openDetail('${game.id}','${t.id}',${i})">
                <span class="tag ${tagClass}">${tagLabel[a.tag]}</span>
                <h4>${title}</h4>
                <div class="excerpt">${excerpt}</div>
            </div>`;
        });
        html += `</div></div>`;
    });

    // Bottom ad
    html += `<div class="ad-container ad-bottom">
        <div class="ad-label">${L==='zh' ? '广告' : 'Advertisement'}</div>
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-2007425330071723"
             data-ad-slot="5437093269"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
    </div>`;

    $contentArea.innerHTML = html;
    // Initialize new AdSense ad units in dynamic content
    try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
}

function switchTab(btn, gameId) {
    const tabId = btn.dataset.tab;
    // Update buttons
    btn.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // Update panels
    document.querySelectorAll(`[id^="tab-${gameId}-"]`).forEach(p => p.classList.remove('active'));
    document.getElementById(`tab-${gameId}-${tabId}`).classList.add('active');
}

// Detail modal
function openDetail(gameId, tabId, articleIndex) {
    const game = gameData.find(g => g.id === gameId);
    const tab = game.tabs.find(t => t.id === tabId);
    const article = tab.articles[articleIndex];
    const L = currentLang;

    $detailContent.innerHTML = `
        <button class="detail-close" onclick="closeDetail()">✕</button>
        <span class="tag detail-tag ${article.tag}">${article.tag==='beginner'?(L==='zh'?'入门必更':'Starter Guide'):article.tag==='core'?(L==='zh'?'核心攻略':'Core Guide'):(L==='zh'?'长尾问题':'Advanced')}</span>
        <h3>${L==='zh' ? article.zh : article.en}</h3>
        <div class="detail-body">${L==='zh' ? article.detailZh : article.detailEn}</div>
    `;
    $detailModal.classList.add('open');
}

function closeDetail() {
    $detailModal.classList.remove('open');
}

$detailModal.addEventListener('click', function(e) {
    if(e.target === this) closeDetail();
});

// Language switch
const $langBtn = document.getElementById('langToggle');
$langBtn.addEventListener('click', () => {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    $langBtn.textContent = currentLang === 'zh' ? '🌐 English' : '🌐 中文';
    document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
    // Update all data-zh/data-en elements
    document.querySelectorAll('[data-zh][data-en]').forEach(el => {
        const text = el.getAttribute('data-' + currentLang);
        if(text !== null && text !== undefined) el.textContent = text;
    });
    // Update search placeholder
    $searchInput.placeholder = currentLang === 'zh' ? '搜索攻略...' : 'Search guides...';
    // Re-render current game
    if(currentGame) renderGame(currentGame);
    try { localStorage.setItem('gg-lang', currentLang); } catch(e) {}
});

// Search
$searchInput.addEventListener('input', function() {
    const query = this.value.toLowerCase().trim();
    if(!query) {
        if(currentGame) renderGame(currentGame);
        return;
    }
    // Search across all games
    const results = [];
    gameData.forEach(game => {
        game.tabs.forEach(tab => {
            tab.articles.forEach((article, i) => {
                const zhText = article.zh + article.exZh + article.detailZh;
                const enText = article.en + article.exEn + article.detailEn;
                if(zhText.toLowerCase().includes(query) || enText.toLowerCase().includes(query)) {
                    results.push({game, tab, article, index: i});
                }
            });
        });
    });

    // Render search results
    if(results.length === 0) {
        $contentArea.innerHTML = `<div class="page-hero" style="text-align:center;padding:60px 20px;">
            <span style="font-size:3rem;display:block;margin-bottom:16px;">🔍</span>
            <h2 data-zh="未找到结果" data-en="No Results Found">未找到结果</h2>
            <p class="desc" data-zh="尝试其他关键词搜索" data-en="Try a different search term" style="margin-top:8px;">尝试其他关键词搜索</p>
        </div>`;
        return;
    }

    const L = currentLang;
    let html = `<div class="page-hero">
        <h2>🔍 ${L==='zh'?'搜索结果':'Search Results'} (${results.length})</h2>
    </div><div class="article-grid">`;
    results.forEach(r => {
        const gameName = L==='zh' ? r.game.zh : r.game.en;
        const title = L==='zh' ? r.article.zh : r.article.en;
        const excerpt = L==='zh' ? r.article.exZh : r.article.exEn;
        html += `<div class="article-card" onclick="selectGame('${r.game.id}');setTimeout(()=>switchTab(document.querySelector('.tab-btn[data-tab=\"${r.tab.id}\"]'),'${r.game.id}'),300)">
            <span class="tag ${r.article.tag}" style="margin-bottom:6px;">${gameName}</span>
            <h4>${title}</h4>
            <div class="excerpt">${excerpt}</div>
        </div>`;
    });
    html += `</div>`;
    // Bottom ad for search results
    html += `<div class="ad-container ad-bottom">
        <div class="ad-label">${L==='zh' ? '广告' : 'Advertisement'}</div>
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-2007425330071723"
             data-ad-slot="5437093269"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
    </div>`;
    $contentArea.innerHTML = html;
    $breadcrumb.innerHTML = `<span>🔍 ${L==='zh'?'搜索':'Search'}: "${query}"</span>`;
    // Initialize new ads
    try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
});

// Mobile menu
document.getElementById('menuToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
});

// Close sidebar on outside click (mobile)
document.addEventListener('click', (e) => {
    const sidebar = document.getElementById('sidebar');
    const menuToggle = document.getElementById('menuToggle');
    if(!sidebar.contains(e.target) && e.target !== menuToggle && !menuToggle.contains(e.target)) {
        sidebar.classList.remove('open');
    }
});

// Init
buildSidebar();

// Load language preference
try {
    const saved = localStorage.getItem('gg-lang');
    if(saved === 'en') {
        currentLang = 'en';
        $langBtn.textContent = '🌐 中文';
        document.documentElement.lang = 'en';
    }
} catch(e) {}

// Select first game by default
const firstGame = gameData[0];
selectGame(firstGame.id);

// Global functions for onclick handlers
window.toggleCat = toggleCat;
window.selectGame = selectGame;
window.switchTab = switchTab;
window.openDetail = openDetail;
window.closeDetail = closeDetail;
</script>
</body>
